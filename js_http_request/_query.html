###########################################################################
@main[]
<script type="text/javascript" language="JavaScript" 
  src="^file:find[JsHttpRequest.js]"></script>
^js[^file:find[_js_http_request_load.html]]


<form>
    Text: <input type="text" id="text">
    <input type="button" value="Calculate MD5" onclick="doLoad()">
</form>

<div id="result" style="border:1px solid #000; padding:2px">
    Structured results
</div>
<div id="debug" style="border:1px dashed red; padding:2px">
    Debug info
</div>

<hr>

@js[sLoaderUri]
<script type="text/javascript" language="JavaScript">
function doLoad() {
    JsHttpRequest.query(
        '$sLoaderUri', 
        { q: document.getElementById('text').value },
        function(responseJS, responseText) {
            // This function is called on data ready (readyState=4).
            // Write result to page element.
            document.getElementById('result').innerHTML = 
                '<b>MD5("'+responseJS.q+'")</b> = ' +
                '"' + responseJS.md5 + '"<br> ';
            // Write debug information too (output become responseText).
            document.getElementById('debug').innerHTML = responseText;
        },
        false // do not disable caching
    );
}
</script>
